name: Release Windows Installer

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:
    inputs:
      tag:
        description: 'Release tag to build and publish (e.g. v1.2.3). Defaults to the pushed tag.'
        required: false
        type: string

permissions:
  contents: write

jobs:
  build-windows-installer:
    runs-on: windows-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Resolve release tag
        id: release_tag
        shell: pwsh
        run: |
          $tag = "${{ github.event.inputs.tag }}"
          if ([string]::IsNullOrWhiteSpace($tag)) {
            $tag = "${{ github.ref_name }}"
          }
          if ([string]::IsNullOrWhiteSpace($tag)) {
            throw "No tag resolved: provide the 'tag' input for workflow_dispatch or push a 'v*' tag."
          }
          "tag=$tag" >> $env:GITHUB_OUTPUT

      # Current build-windows-installer.ps1 / build-windows-app.ps1 produce an
      # unsigned installer; signing TBD. windows-latest ships csc.exe (.NET
      # Framework), node, and powershell/pwsh out of the box, so no extra
      # toolchain setup is required here.
      - name: Build Windows installer (unsigned installer; signing TBD)
        shell: pwsh
        run: |
          $version = node -p "require('./package.json').version"
          $outputExe = "build/windows/chatgpt2codex-$version-windows-setup.exe"
          Write-Host "Building $outputExe"
          pwsh -File scripts/build-windows-installer.ps1 -OutputExe $outputExe

      - name: Upload installer to GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ steps.release_tag.outputs.tag }}
          files: build/windows/*.exe
          fail_on_unmatched_files: true
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
